name: Native verification

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      all-architectures:
        description: Verify both native architectures for release packaging.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.all-architectures && '[{"runner":"macos-latest","arch":"arm64"},{"runner":"macos-26-intel","arch":"amd64"}]' || '[{"runner":"macos-latest","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RECORDER_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install approved task runner
        run: sh scripts/install-ci-just.sh
      # The native build verifies each archive's pinned SHA-256 whether it was
      # restored here or downloaded, so a cache hit never skips verification.
      - name: Restore pinned native source archives
        uses: actions/cache@v6
        with:
          path: .tmp/downloads
          key: native-sources-${{ hashFiles('scripts/native-sources.txt') }}
      - name: Check, build, verify and package
        shell: bash
        run: |
          mkdir -p .tmp
          export RECORDER_VERSION="${RECORDER_VERSION#v}"
          just release 2>&1 | tee .tmp/release-check.log
      - uses: actions/upload-artifact@v7
        with:
          name: verified-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ matrix.arch }}
          path: .tmp/release-check.log
          if-no-files-found: warn
